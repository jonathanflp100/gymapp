# GymApp — LICENÇA PRÓPRIA (uma academia neste servidor).
#
# 1. Copie .env.example para .env e preencha (domínio, nome, código de ativação).
# 2. docker compose up -d --build
# 3. Abra o endereço, crie sua conta e, em Perfil → "Administrador da academia",
#    digite o SETUP_CODE. Pronto: o ícone de engrenagem abre as configurações.
#
# Para várias academias num servidor só (SaaS), use deploy/saas.
name: gymapp

x-tz: &tz
  TZ: ${TZ:-America/Sao_Paulo}

services:
  # openGym: contas, senhas e os treinos de cada aluno.
  api:
    # Compilado do código oficial do openGym, versão fixa v1.4.4.
    build: https://github.com/DuarteSantos8/openGym.git#v1.4.4:api
    restart: unless-stopped
    environment:
      <<: *tz
      PORT: 3000
      DATA_DIR: /data
      TRUST_PROXY: 1
      # Endereço exato que aparece no navegador (https://app.academia.com.br).
      ORIGIN: ${ORIGIN:-http://localhost:8080}
      RP_ID: ${RP_ID:-localhost}
      PASSWORD_LOGIN: 1
      ALLOW_GUEST: 0
      EXERCISE_MEDIA: "off"
    volumes:
      - ./data/opengym:/data   # BACKUP: contas e treinos

  # Servidor da academia: marca, equipe, fichas do professor, aulas, avaliações, ranking.
  hub:
    build: ./server/hub
    restart: unless-stopped
    environment:
      <<: *tz
      OPENGYM_URL: http://api:3000
      SETUP_CODE: ${SETUP_CODE:?Defina SETUP_CODE no arquivo .env}
      GYM_NAME: ${GYM_NAME:-Minha Academia}
      GYM_COLOR: ${GYM_COLOR:-#DC2626}
      GYM_LANG: ${GYM_LANG:-pt-BR}
      GYM_CODE: ${GYM_CODE:-ACADEMIA}
    volumes:
      - ./data/hub:/data       # BACKUP: marca, equipe, aulas, avaliações
    depends_on:
      - api

  # App (PWA) que os alunos instalam. A marca vem do servidor da academia.
  web:
    build:
      context: .
      args:
        VITE_BRAND: ${BRAND:-forcaTotal}
    restart: unless-stopped
    depends_on:
      - api
      - hub
    ports:
      - "${WEB_PORT:-8080}:80"
