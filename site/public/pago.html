<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>GymApp</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1120; color: #e2e8f0; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; padding: 24px; }
  .card { max-width: 440px; width: 100%; background: #0f172a; border: 1px solid #1e293b; border-radius: 20px; padding: 32px 28px; text-align: center; }
  .icon { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 18px; font-size: 38px; }
  .ok .icon { background: rgba(34,197,94,.15); color: #4ade80; }
  .no .icon { background: rgba(251,191,36,.15); color: #fbbf24; }
  h1 { font-size: 24px; margin: 0 0 10px; }
  p { color: #94a3b8; line-height: 1.5; margin: 0 0 22px; }
  a { display: inline-block; background: #25d366; color: #052e16; font-weight: 800; text-decoration: none; padding: 14px 22px; border-radius: 999px; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="icon" id="icon">✓</div>
  <h1 id="t"></h1>
  <p id="d"></p>
  <a id="w" href="#">WhatsApp</a>
</div>
<script>
  // Página de retorno do pagamento da Stripe: ?ok=1|0&lang=es|pt
  // Coloque aqui o seu WhatsApp com DDI, só números (ex.: 595981000000). Vazio = botão escondido.
  var WHATSAPP = '';
  var q = new URLSearchParams(location.search);
  var ok = q.get('ok') !== '0';
  var es = (q.get('lang') || (navigator.language || '').slice(0, 2)) === 'es';
  var T = {
    es: ok ? ['¡Pago recibido!', 'Tu suscripción de GymApp está activa. En breve te escribimos para dejar la app de tu gimnasio lista.', 'Hablar por WhatsApp']
           : ['Pago no completado', 'No se hizo ningún cobro. Si tuviste algún problema, escribinos y te ayudamos.', 'Hablar por WhatsApp'],
    pt: ok ? ['Pagamento recebido!', 'Sua assinatura do GymApp está ativa. Em breve falamos com você para deixar o app da sua academia pronto.', 'Falar no WhatsApp']
           : ['Pagamento não concluído', 'Nenhuma cobrança foi feita. Se teve algum problema, fale com a gente.', 'Falar no WhatsApp'],
  }[es ? 'es' : 'pt'];
  document.documentElement.lang = es ? 'es' : 'pt-BR';
  document.getElementById('card').className = 'card ' + (ok ? 'ok' : 'no');
  document.getElementById('icon').textContent = ok ? '✓' : '!';
  document.getElementById('t').textContent = T[0];
  document.getElementById('d').textContent = T[1];
  var w = document.getElementById('w');
  w.textContent = T[2];
  if (WHATSAPP) w.href = 'https://wa.me/' + WHATSAPP; else w.style.display = 'none';
</script>
</body>
</html>
