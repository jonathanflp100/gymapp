# Serve o GymApp e repassa /api para o servidor openGym (mesma origem, exigida pelo login).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 48m;

    # Servidor da academia: marca, equipe, aulas, avaliações, ranking
    location /api/hub/ {
        proxy_pass http://hub:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Contas e treinos (openGym)
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos com hash no nome: cache longo. index.html: sempre novo (atualizações chegam na hora).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
